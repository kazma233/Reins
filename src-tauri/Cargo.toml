[package]
name = "reins"
version = "0.2.3"
description = "Read and inspect local coding-agent sessions."
authors = ["kazma"]
license = "MIT"
edition = "2024"
default-run = "reins"

[lib]
name = "reins_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
json5 = "1.3.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = { package = "yaml_serde", version = "0.10" }
rfd = "0.17.2"
tauri = { version = "2.12.5", features = [] }
toml = "1.1.6"
rusqlite = { version = "0.41.1", features = ["bundled"] }
ts-rs = "12"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
walkdir = "2.5.0"
# 转录解压用 libzstd 绑定:codex 的冷会话压缩把可见会话从个位数变成上千个,
# 单次列表/用量采集要解 3GB 级数据,纯 Rust 解码器(83MB/s,且读一行也会解
# 大半个帧)会把首屏拖到一分钟级。
zstd = "0.14.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "system-proxy"] }

[target.'cfg(windows)'.dependencies]
junction = "2.1.0"
dunce = "1.0.5"
